name: homepage

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: homepage
      MYSQL_USER: homepage
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      # 保持卷键不变，升级前后端结构不会创建空数据库卷。
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [data, db-access]

  backend:
    build: ./backend
    image: homepage-backend:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_USERNAME: ${ADMIN_USERNAME:?请在 .env 里设置 ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 里设置 ADMIN_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/homepage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: homepage
      DB_PASSWORD: ${MYSQL_PASSWORD}
      VISITOR_UNIQUE_WINDOW: ${VISITOR_UNIQUE_WINDOW:-24h}
      VISITOR_LOG_RETENTION: ${VISITOR_LOG_RETENTION:-90d}
      VISITOR_HASH_SALT: ${VISITOR_HASH_SALT:?请在 .env 里设置 VISITOR_HASH_SALT}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?请在 .env 里设置 TOTP_ENCRYPTION_KEY}
      TOTP_KEY_ID: ${TOTP_KEY_ID:-v1}
      TOTP_ISSUER: ${TOTP_ISSUER:-huangxin.work}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_DEFAULT_ENCODING: UTF-8
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${MAIL_SSL:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_STARTTLS:-false}
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Shanghai
    expose: ["8080"]
    networks: [edge, data]

  frontend:
    build: ./frontend
    image: homepage-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      BACKEND_ORIGIN: http://backend:8080
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3000"
    networks: [edge]

volumes:
  mysql-data:

networks:
  edge:
  data:
    internal: true
  db-access:
    # 仅 MySQL 使用，使宿主机 127.0.0.1:3307 可用于本地数据库管理工具。
