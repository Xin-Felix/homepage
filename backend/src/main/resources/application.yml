# 默认配置：本地开发直接 ./mvnw spring-boot:run 即可，数据存在 ./data 下的 H2 文件库
spring:
  application:
    name: homepage
  web:
    resources:
      # 后端只提供 REST；页面和静态文件由 frontend 服务负责
      add-mappings: false
  datasource:
    url: jdbc:h2:file:./data/homepage
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        auto_quote_keyword: true
  jackson:
    time-zone: Asia/Shanghai
  # 只设超时，不设 host：没配置 SMTP 时不会创建邮件发送器
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}

homepage:
  admin:
    # 生产环境必须通过环境变量配置固定账号和密码
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    token-ttl: 12h
  rate-limit:
    capacity: 600
    period: 30s
    login-failures: 5
    login-period: 15m
    messages: 5
    message-period: 10m
  views:
    # 同一 IP 在该窗口内只计一次；日志持久化到数据库
    unique-window: ${VISITOR_UNIQUE_WINDOW:24h}
    # 访问日志默认保留 90 天，累计访问总数不会随日志清理减少
    log-retention: ${VISITOR_LOG_RETENTION:90d}
    # 对 IP 指纹加盐；生产环境必须配置独立随机值
    hash-salt: ${VISITOR_HASH_SALT:}
  notification:
    # 新留言邮件提醒的收件人；还需要配置 spring.mail.*（见 README）
    email: ${NOTIFY_EMAIL:}
    from: ${NOTIFY_FROM:}
